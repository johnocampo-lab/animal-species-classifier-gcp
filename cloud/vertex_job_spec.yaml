# vertex_job_spec.yaml
# Ephemeral Vertex AI Custom Training Job Specification
# Runs on 1x n1-standard-4 with 1x NVIDIA Tesla T4 GPU (or CPU)
# Budget: ~15 minutes runtime = ~$0.15 total. Auto-terminates on completion.

workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1
    replicaCount: 1
    containerSpec:
      imageUri: us-docker.pkg.dev/vertex-ai/training/pytorch-gpu.2-2.py310:latest
      command: ["python", "-m", "training.train"]
      args:
        - "--data-dir=/gcs/sbox-johnny-001-ml-assets/data/processed"
        - "--output-dir=/gcs/sbox-johnny-001-ml-assets/models"
        - "--epochs=10"
        - "--batch-size=32"
        - "--lr=0.001"
